<!doctype html>
<meta charset="utf-8">
<title>DEP Coastlines</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  .basemap-toggle-btn { font: 700 10px sans-serif; letter-spacing: .5px; background: transparent; border: none; color: #333; cursor: pointer; }
</style>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
// Public client-side key (same as cogniscient), locked to allowed origins in MapTiler.
const KEY = 'ZUYgDOuttJIaWHdE632Y';
const BASEMAPS = { Map: 'dataviz-dark', Satellite: 'hybrid' };  // hybrid = satellite + place labels
const OSM = { version: 8, sources: { osm: { type: 'raster', tileSize: 256, attribution: '© OpenStreetMap',
  tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'] } }, layers: [{ id: 'osm', type: 'raster', source: 'osm' }] };
// Our year/rate labels use the default font stack, which the tileserver styles load from demotiles.
const GLYPHS = 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf';
const url = (name) => `https://api.maptiler.com/maps/${BASEMAPS[name]}/style.json?key=${KEY}`;
// Fetch the style ourselves so a rejected key (origin-restricted, e.g. localhost) cleanly falls back to OSM.
const basemap = (name) => fetch(url(name)).then(r => r.ok ? r.json() : Promise.reject(r.status))
  .catch(() => OSM).then(style => ({ ...style, glyphs: GLYPHS }));

maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
const map = new maplibregl.Map({ container: 'map', style: { version: 8, sources: {}, layers: [] }, center: [106, 16], zoom: 5, hash: true });
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
map.addControl({  // basemap toggle, same model as cogniscient: a button in a top-right control group
  onAdd() {
    this.el = document.createElement('div');
    this.el.className = 'maplibregl-ctrl maplibregl-ctrl-group';
    this.btn = this.el.appendChild(document.createElement('button'));
    this.btn.type = 'button'; this.btn.className = 'basemap-toggle-btn';
    this.btn.textContent = 'SAT'; this.btn.title = 'Switch to satellite';
    this.btn.onclick = () => {
      const sat = this.btn.textContent === 'SAT';
      basemap(sat ? 'Satellite' : 'Map').then(style => map.setStyle(style, { diff: false }));  // diff:false so style.load fires and layers are re-added
      this.btn.textContent = sat ? 'MAP' : 'SAT';
      this.btn.title = sat ? 'Switch to map' : 'Switch to satellite';
    };
    return this.el;
  },
  onRemove() { this.el.remove(); },
}, 'top-right');

let coastlines;  // load our styles before the first basemap so style.load always has them
fetch('styles.json').then(r => r.json()).then(s => { coastlines = s; return basemap('Map'); })
  .then(style => map.setStyle(style, { diff: false }));

function add() {
  if (map.getSource('coastlines')) return;
  map.addSource('coastlines', { type: 'vector', url: 'pmtiles://https://files.auspatious.com/coastlines/final/vietnam_coastlines_0.8.3.pmtiles' });
  // Lines/circles go beneath the basemap's place labels; our own year/rate labels stay on top.
  const firstLabel = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  coastlines.layers.forEach(l => map.addLayer(l, l.type === 'symbol' ? undefined : firstLabel));
}
map.on('style.load', add);
map.on('error', e => console.error('map error:', e.error));  // a listener suppresses MapLibre's default logging
</script>
